# Quick static checks for the release pipeline (seconds, no Rust build): workflow syntax,
# packaging shell/PowerShell scripts, and the Linux desktop/AppStream/Flatpak metadata.
name: Packaging lint

on:
  push:
    # Embed build: the embed branches (named *-embed) run these too, for the embed packaging scripts.
    branches: [main, release, "*-embed"]
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  pull_request:
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Intentionally tracked at @main (not SHA-pinned) so org-wide CI improvements, security fixes, and build optimizations propagate without PR churn across all craftapp repos.
    uses: storytold/craft-common-actions/.github/workflows/packaging-lint.yml@main
  # Embed build: the self-tests of the embed packaging scripts (no Rust build).
  embed-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify-zip.sh refuses crafted zips
        run: packaging/embed/test-verify-zip.sh
      - name: rustflags guard refuses only flags the wasm build would lose
        run: packaging/embed/test-rustflags-guard.sh
