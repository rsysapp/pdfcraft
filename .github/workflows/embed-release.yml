# Embed build release: a tag embed-v<version> builds pdfcraft-embed-<version>.zip (the module, its
# generated JavaScript glue and TypeScript declarations, licences including those of the compiled-in
# Rust crates, SHA256SUMS) and attaches it to a GitHub release of that tag. See
# apps/pdfcraft-embed/README.md.
name: Embed release

on:
  push:
    tags: ["embed-v*"]
  workflow_dispatch:

# No token rights by default; each job asks for its own.
permissions: {}

concurrency:
  group: embed-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Builds with a read-only token. Nothing here can write to the repository. No build cache: a
  # restored cache could carry another run's outputs into the release. A named runner image, not
  # -latest, keeps the operating system from changing between releases.
  build:
    name: Embed build (wasm)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: The tag names the crate's version
        if: github.ref_type == 'tag'
        run: |
          have="$(packaging/embed/package.sh --print-version)"
          if [ "embed-v$have" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but apps/pdfcraft-embed is version $have"
            exit 1
          fi
      # dtolnay/rust-toolchain publishes each Rust release as a branch, not a tag; this is the
      # 1.95.0 branch's commit.
      - uses: dtolnay/rust-toolchain@1d64bbcee8ef0c191a54710c227fd268a0d5014b # 1.95.0
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen (the version in Cargo.lock)
        run: |
          v="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)"
          cargo install wasm-bindgen-cli --version "$v" --locked
      # The version and SHA-256 are in packaging/embed/tools.env (package.sh refuses another
      # wasm-opt); the script checks the tarball.
      - name: Install wasm-opt (binaryen)
        run: packaging/embed/install-binaryen.sh
      # The version and SHA-256 are in packaging/embed/cargo-about.env; the script checks the tarball.
      - name: Install cargo-about (licence notices of the Rust crates)
        run: packaging/embed/install-cargo-about.sh
      - name: Build and zip
        run: packaging/embed/package.sh
      # The zip's own SHA256SUMS against its files, and the zip against its .sha256.
      - name: Check the zip against its checksums
        run: packaging/embed/verify-zip.sh "dist/release/pdfcraft-embed-$(packaging/embed/package.sh --print-version).zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pdfcraft-embed
          path: dist/release/pdfcraft-embed-*
          if-no-files-found: error

  # Holds the write token and runs only `gh`: no toolchain, cargo or build action.
  release:
    name: Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Only for the attestation below: the OIDC token that Sigstore signs the provenance with,
      # and the right to store the attestation against this repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pdfcraft-embed
          path: release
      - name: Check the download against its checksum
        id: files
        run: |
          version="${GITHUB_REF_NAME#embed-v}"
          (cd release && sha256sum -c "pdfcraft-embed-$version.zip.sha256")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Signed build provenance (Sigstore, through GitHub): ties the zip to this repository, this
      # workflow and this tag, so a host can check where the file came from, not only that it
      # matches its checksum. The checksum file is a separate release asset, so it is attested too.
      # `gh attestation verify pdfcraft-embed-<version>.zip --repo rsysapp/pdfcraft`
      - name: Attest the release files
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            release/pdfcraft-embed-${{ steps.files.outputs.version }}.zip
            release/pdfcraft-embed-${{ steps.files.outputs.version }}.zip.sha256
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.files.outputs.version }}
        run: |
          cd release
          gh release create "$GITHUB_REF_NAME" "pdfcraft-embed-$VERSION.zip" "pdfcraft-embed-$VERSION.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Embed build $VERSION" \
            --notes "pdfcraft-embed-$VERSION.zip: the embed build's WebAssembly module, generated JavaScript glue and TypeScript declarations, licences (including those of the compiled-in Rust crates) and SHA256SUMS. See apps/pdfcraft-embed/README.md." \
            --latest=false \
            --verify-tag
