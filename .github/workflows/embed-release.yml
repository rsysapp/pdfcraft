# Embed build release: a tag embed-v<version> builds pdfcraft-embed-<version>.zip (the module, its
# generated JavaScript glue and TypeScript declarations, licences including those of the compiled-in
# Rust crates, SHA256SUMS) and attaches it to a GitHub release of that tag. See
# apps/pdfcraft-embed/README.md.
name: Embed release

on:
  push:
    tags: ["embed-v*"]
  workflow_dispatch:

# No token rights by default; each job asks for its own.
permissions: {}

concurrency:
  group: embed-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  BINARYEN_VERSION: "123"
  # From the release's own .sha256 asset, cross-checked by hashing the tarball.
  BINARYEN_SHA256: e959f2170af4c20c552e9de3a0253704d6a9d2766e8fdb88e4d6ac4bae9388fe
  # packaging/embed/package.sh refuses any other cargo-about version. The hash is the one in the
  # release's own .sha256 asset, cross-checked by hashing the tarball.
  CARGO_ABOUT_VERSION: "0.9.2"
  CARGO_ABOUT_SHA256: 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af

jobs:
  # Builds with a read-only token. Nothing here can write to the repository. No build cache: a
  # restored cache could carry another run's outputs into the release. A named runner image, not
  # -latest, keeps the operating system from changing between releases.
  build:
    name: Embed build (wasm)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: The tag names the crate's version
        if: github.ref_type == 'tag'
        run: |
          have="$(packaging/embed/package.sh --print-version)"
          if [ "embed-v$have" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but apps/pdfcraft-embed is version $have"
            exit 1
          fi
      # dtolnay/rust-toolchain publishes each Rust release as a branch, not a tag; this is the
      # 1.95.0 branch's commit.
      - uses: dtolnay/rust-toolchain@1d64bbcee8ef0c191a54710c227fd268a0d5014b # 1.95.0
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen (the version in Cargo.lock)
        run: |
          v="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)"
          cargo install wasm-bindgen-cli --version "$v" --locked
      - name: Install wasm-opt (binaryen)
        run: |
          tarball="binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/$tarball"
          echo "$BINARYEN_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Install cargo-about (licence notices of the Rust crates)
        run: |
          dir="cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o "$RUNNER_TEMP/$dir.tar.gz" "https://github.com/EmbarkStudios/cargo-about/releases/download/${CARGO_ABOUT_VERSION}/$dir.tar.gz"
          echo "$CARGO_ABOUT_SHA256  $RUNNER_TEMP/$dir.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$dir.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$dir" >> "$GITHUB_PATH"
      - name: Build and zip
        run: packaging/embed/package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pdfcraft-embed
          path: dist/release/pdfcraft-embed-*
          if-no-files-found: error

  # Holds the write token and runs only `gh`: no toolchain, cargo or build action.
  release:
    name: Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pdfcraft-embed
          path: release
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#embed-v}"
          cd release
          sha256sum -c "pdfcraft-embed-$version.zip.sha256"
          gh release create "$GITHUB_REF_NAME" "pdfcraft-embed-$version.zip" "pdfcraft-embed-$version.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Embed build $version" \
            --notes "pdfcraft-embed-$version.zip: the embed build's WebAssembly module, generated JavaScript glue and TypeScript declarations, licences (including those of the compiled-in Rust crates) and SHA256SUMS. See apps/pdfcraft-embed/README.md." \
            --latest=false \
            --verify-tag
